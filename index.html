<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#121212">
  <title>GAN Smart Cube Timer</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script>
    (function () {
      const svgIcon = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">
        <rect width="192" height="192" rx="36" fill="#121212"/>
        <g transform="translate(24,24)">
          <rect x="4" y="4" width="42" height="42" rx="6" fill="#d50000"/>
          <rect x="51" y="4" width="42" height="42" rx="6" fill="#ffffff"/>
          <rect x="98" y="4" width="42" height="42" rx="6" fill="#2962ff"/>
          <rect x="4" y="51" width="42" height="42" rx="6" fill="#ffd600"/>
          <rect x="51" y="51" width="42" height="42" rx="6" fill="#00c853"/>
          <rect x="98" y="51" width="42" height="42" rx="6" fill="#ff6d00"/>
          <rect x="4" y="98" width="42" height="42" rx="6" fill="#2962ff"/>
          <rect x="51" y="98" width="42" height="42" rx="6" fill="#d50000"/>
          <rect x="98" y="98" width="42" height="42" rx="6" fill="#ffd600"/>
        </g>
      </svg>`;
      const iconUrl = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svgIcon);

      const linkIcon = document.createElement('link');
      linkIcon.rel = 'icon';
      linkIcon.href = iconUrl;
      document.head.appendChild(linkIcon);

      const manifest = {
        name: 'GAN Smart Cube Timer',
        short_name: 'GAN Timer',
        start_url: '.',
        display: 'standalone',
        background_color: '#121212',
        theme_color: '#121212',
        orientation: 'portrait',
        icons: [
          {
            src: iconUrl,
            sizes: '192x192',
            type: 'image/svg+xml',
            purpose: 'any maskable'
          }
        ]
      };
      const blob = new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' });
      const manifestLink = document.createElement('link');
      manifestLink.rel = 'manifest';
      manifestLink.href = URL.createObjectURL(blob);
      document.head.appendChild(manifestLink);
    })();
  </script>
  <style>
    :root {
      --bg-color: #121212;
      --surface-color: #1e1e1e;
      --text-color: #ffffff;
      --sub-text-color: #9e9e9e;
      --primary-color: #2196f3;
      --success-color: #4caf50;
      --warning-color: #ff9800;
      --error-color: #f44336;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      overscroll-behavior-y: none;
      touch-action: manipulation;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      height: 100dvh;
      overflow: hidden;
      padding: 10px 14px;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* 上部コントロールバー */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
      flex-shrink: 0;
    }

    .status-badge {
      font-size: 0.8rem;
      font-weight: bold;
      padding: 6px 10px;
      border-radius: 8px;
      background-color: var(--surface-color);
      border: 1px solid #333;
      color: var(--sub-text-color);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }

    .status-connected { border-color: var(--success-color); color: var(--success-color); }
    .status-connecting { border-color: var(--warning-color); color: var(--warning-color); }
    .status-error { border-color: var(--error-color); color: var(--error-color); }

    .btn-small {
      padding: 8px 12px;
      font-size: 0.85rem;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      color: #fff;
      background-color: var(--primary-color);
      white-space: nowrap;
    }

    .btn-small:active { opacity: 0.8; }
    .btn-small.btn-disconnect { background-color: var(--error-color); }
    .btn-small.btn-secondary { background-color: #333; border: 1px solid #555; }

    /* タブ切り替えバー */
    .tab-bar {
      display: flex;
      gap: 6px;
      margin-bottom: 8px;
      flex-shrink: 0;
    }

    .tab-btn {
      flex: 1;
      padding: 8px;
      font-size: 0.85rem;
      font-weight: bold;
      border: 1px solid #333;
      border-radius: 8px;
      background-color: var(--surface-color);
      color: var(--sub-text-color);
      cursor: pointer;
    }

    .tab-btn.active {
      background-color: var(--primary-color);
      border-color: var(--primary-color);
      color: #fff;
    }

    /* メインビュー切り替え */
    .view-section {
      display: none;
      flex-direction: column;
      flex: 1;
      min-height: 0;
    }

    .view-section.active {
      display: flex;
    }

    /* スクランブル表示エリア */
    .scramble-box {
      background-color: var(--surface-color);
      border-radius: 12px;
      padding: 8px 10px;
      margin-bottom: 8px;
      flex-shrink: 0;
      text-align: center;
      border: 1px solid #2c2c2c;
    }

    .scramble-moves {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 5px;
      font-family: monospace;
      font-size: 1.05rem;
      font-weight: bold;
      line-height: 1.35;
    }

    .s-move {
      color: var(--text-color);
      padding: 2px 4px;
      border-radius: 4px;
      transition: all 0.15s;
    }

    .s-move.done {
      color: #555;
      text-decoration: line-through;
    }

    .s-move.current {
      background-color: var(--primary-color);
      color: #fff;
    }

    #correction-guide {
      margin-top: 4px;
      font-size: 0.9rem;
      font-weight: bold;
      color: var(--error-color);
      min-height: 20px;
    }

    #replay-scramble-box {
      display: none;
      background-color: var(--surface-color);
      border-radius: 10px;
      padding: 6px 10px;
      margin-bottom: 6px;
      flex-shrink: 0;
      text-align: center;
      border: 1px solid #2c2c2c;
      font-family: monospace;
      font-size: 0.9rem;
      color: #ccc;
      line-height: 1.35;
    }

    /* 3Dキューブ＋右側統計ミニパネル */
    .cube-stage {
      flex: 1;
      min-height: 100px;
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    .cube-container {
      flex: 1;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      perspective: 750px;
      touch-action: none;
    }

    .cube-3d {
      width: 0;
      height: 0;
      position: relative;
      transform-style: preserve-3d;
      transform: rotateX(-25deg) rotateY(-35deg);
    }

    .cube-orientation {
      width: 0;
      height: 0;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.3s ease;
    }

    .turn-layer {
      position: absolute;
      width: 0;
      height: 0;
      transform-style: preserve-3d;
    }

    .cubie {
      position: absolute;
      width: 36px;
      height: 36px;
      left: -18px;
      top: -18px;
      transform-style: preserve-3d;
    }

    .cubie-face {
      position: absolute;
      width: 36px;
      height: 36px;
      background-color: #111;
      border: 2px solid #111;
      border-radius: 4px;
      backface-visibility: hidden;
    }

    .cf-U { transform: rotateX(90deg) translateZ(18px); }
    .cf-D { transform: rotateX(-90deg) translateZ(18px); }
    .cf-F { transform: translateZ(18px); }
    .cf-B { transform: rotateY(180deg) translateZ(18px); }
    .cf-R { transform: rotateY(90deg) translateZ(18px); }
    .cf-L { transform: rotateY(-90deg) translateZ(18px); }

    /* 右側統計ミニパネル */
    .timer-stats-panel {
      width: 122px;
      flex-shrink: 0;
      background-color: var(--surface-color);
      border: 1px solid #2c2c2c;
      border-radius: 10px;
      padding: 6px 8px;
      font-family: monospace;
      font-size: 0.7rem;
      line-height: 1.35;
    }

    .tsp-title {
      font-family: sans-serif;
      font-size: 0.65rem;
      font-weight: bold;
      color: var(--primary-color);
      border-bottom: 1px solid #333;
      margin-bottom: 2px;
      padding-bottom: 1px;
    }

    .tsp-title.best {
      color: var(--warning-color);
      margin-top: 5px;
    }

    .tsp-row {
      display: flex;
      justify-content: space-between;
      color: #ddd;
    }

    .tsp-row span:last-child {
      font-weight: bold;
      color: #fff;
    }

    /* タイマー＆CFOP分析エリア */
    .timer-box {
      background-color: var(--surface-color);
      border-radius: 16px;
      padding: 10px 14px;
      text-align: center;
      flex-shrink: 0;
      border: 1px solid #2c2c2c;
    }

    #timer-state {
      font-size: 0.8rem;
      font-weight: bold;
      letter-spacing: 1px;
      color: var(--sub-text-color);
      margin-bottom: 2px;
    }

    .state-ready { color: var(--success-color) !important; }
    .state-solving { color: var(--warning-color) !important; }
    .state-solved { color: var(--primary-color) !important; }

    #timer-display {
      font-family: monospace;
      font-size: 2.8rem;
      font-weight: 800;
      line-height: 1.05;
      margin-bottom: 2px;
      font-variant-numeric: tabular-nums;
    }

    #total-stats {
      display: none;
      font-size: 0.85rem;
      font-weight: bold;
      color: #ccc;
      margin-bottom: 4px;
      font-family: monospace;
    }

    #gesture-hint {
      display: none;
      font-size: 0.7rem;
      color: var(--sub-text-color);
      margin-bottom: 6px;
    }

    /* CFOP 4段階＋アコーディオンパネル */
    #cfop-panel {
      display: none;
      margin-bottom: 8px;
      background-color: #141414;
      border-radius: 10px;
      padding: 8px;
      border: 1px solid #2c2c2c;
    }

    .cfop-summary {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
    }

    .cfop-card {
      background-color: #222;
      border-radius: 8px;
      padding: 6px 3px;
      display: flex;
      flex-direction: column;
      align-items: center;
      border: 1px solid transparent;
    }

    .cfop-card.clickable {
      cursor: pointer;
      border-color: #383838;
    }

    .cfop-card.clickable:active { background-color: #2c2c2c; }
    .cfop-card.active { border-color: var(--primary-color); background-color: #1a2836; }

    .cfop-label {
      font-size: 0.68rem;
      color: var(--sub-text-color);
      margin-bottom: 2px;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 2px;
    }

    .cfop-val {
      font-family: monospace;
      font-size: 0.88rem;
      font-weight: bold;
      color: #fff;
    }

    .cfop-sub {
      font-family: monospace;
      font-size: 0.65rem;
      color: #aaa;
      margin-top: 2px;
    }

    .cfop-skip { color: var(--success-color); font-size: 0.78rem; }

    .cfop-detail {
      display: none;
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid #2c2c2c;
      text-align: left;
    }

    .cfop-detail.open { display: block; }

    .detail-row {
      display: flex;
      justify-content: space-between;
      padding: 3px 6px;
      font-size: 0.8rem;
      color: #ddd;
    }

    .detail-row span:last-child { font-family: monospace; font-weight: bold; }

    /* リプレイパネル */
    #replay-panel {
      display: none;
      background-color: var(--surface-color);
      border-radius: 16px;
      padding: 12px 14px;
      flex-shrink: 0;
      border: 1px solid #2c2c2c;
    }

    .replay-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .replay-phase-badge {
      font-size: 0.8rem;
      font-weight: bold;
      padding: 3px 8px;
      border-radius: 6px;
      background-color: #333;
      color: #fff;
    }

    .replay-move-badge {
      font-family: monospace;
      font-size: 1.1rem;
      font-weight: bold;
      color: var(--primary-color);
      min-width: 32px;
      text-align: center;
    }

    .replay-time-text {
      font-family: monospace;
      font-size: 1rem;
      font-weight: bold;
    }

    .seekbar-wrapper {
      position: relative;
      height: 24px;
      display: flex;
      align-items: center;
      margin-bottom: 6px;
      touch-action: none;
      cursor: pointer;
    }

    .seekbar-track {
      width: 100%;
      height: 10px;
      border-radius: 5px;
      background-color: #333;
      overflow: hidden;
      display: flex;
    }

    .seekbar-thumb {
      position: absolute;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background-color: #fff;
      box-shadow: 0 0 6px rgba(0,0,0,0.6);
      transform: translateX(-50%);
      left: 0%;
      pointer-events: none;
    }

    .cfop-legend {
      display: flex;
      justify-content: center;
      gap: 10px;
      font-size: 0.7rem;
      color: var(--sub-text-color);
      margin-bottom: 10px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .legend-dot {
      width: 8px;
      height: 8px;
      border-radius: 2px;
    }

    .replay-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .btn-replay-ctrl {
      padding: 8px 14px;
      font-size: 0.9rem;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      background-color: var(--primary-color);
      color: #fff;
      cursor: pointer;
    }

    .btn-speed {
      background-color: #333;
      border: 1px solid #555;
    }

    .btn-exit-replay {
      background-color: #2c2c2c;
      border: 1px solid #444;
    }

    .bottom-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
    }

    .btn-next {
      flex: 1;
      padding: 10px 6px;
      font-size: 0.9rem;
      font-weight: bold;
      background-color: #2c2c2c;
      color: #fff;
      border: 1px solid #444;
      border-radius: 10px;
      cursor: pointer;
    }

    .btn-next:active { background-color: #3c3c3c; }

    .btn-replay-start {
      flex: 1;
      padding: 10px 6px;
      font-size: 0.9rem;
      font-weight: bold;
      background-color: var(--primary-color);
      color: #fff;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      display: none;
    }

    .btn-delete-last {
      padding: 10px 10px;
      font-size: 0.9rem;
      font-weight: bold;
      background-color: var(--error-color);
      color: #fff;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      display: none;
      white-space: nowrap;
    }

    /* ==========================================
       履歴（タイム一覧）画面
       ========================================== */
    .table-wrapper {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      background-color: var(--surface-color);
      border-radius: 12px;
      border: 1px solid #2c2c2c;
      margin-bottom: 8px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
    }

    thead {
      position: sticky;
      top: 0;
      background-color: #262626;
      z-index: 2;
    }

    th {
      padding: 10px 8px;
      text-align: right;
      color: var(--sub-text-color);
      font-weight: bold;
      border-bottom: 1px solid #333;
      cursor: pointer;
    }

    th:first-child { text-align: left; }
    th.sort-active { color: var(--primary-color); }

    td {
      padding: 11px 8px;
      text-align: right;
      border-bottom: 1px solid #2a2a2a;
      font-family: monospace;
    }

    td:first-child {
      text-align: left;
      font-family: sans-serif;
      color: #ccc;
      font-size: 0.8rem;
    }

    tr.history-row { cursor: pointer; }
    tr.history-row:active, tr.history-row.selected { background-color: #232d38; }

    tr.accordion-row td {
      padding: 0;
      text-align: left;
      background-color: #161a20;
      border-bottom: 1px solid #333;
    }

    .acc-content { padding: 6px 8px; }

    .acc-list {
      display: flex;
      flex-direction: column;
      gap: 1px;
      margin-bottom: 6px;
      font-family: monospace;
      font-size: 0.74rem;
      line-height: 1.2;
      font-variant-numeric: tabular-nums;
    }

    .acc-line {
      display: grid;
      grid-template-columns: 98px 1fr 62px 68px;
      align-items: center;
      padding: 2px 5px;
      border-radius: 4px;
      color: #e0e0e0;
    }

    .acc-line.indent {
      background-color: rgba(255, 255, 255, 0.08);
      color: #f0f0f0;
    }

    .acc-line.indent .acc-name {
      padding-left: 8px;
      color: #f0f0f0;
    }

    .acc-name {
      font-weight: bold;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .num-time {
      display: inline-block;
      min-width: 6ch;
      text-align: right;
    }

    .num-step {
      display: inline-block;
      min-width: 2ch;
      text-align: right;
    }

    .num-tps {
      display: inline-block;
      min-width: 5ch;
      text-align: right;
    }

    .acc-actions {
      display: flex;
      gap: 8px;
    }

    .btn-acc-replay {
      flex: 1;
      padding: 7px;
      border: none;
      border-radius: 8px;
      background-color: var(--primary-color);
      color: #fff;
      font-weight: bold;
      font-size: 0.82rem;
      cursor: pointer;
    }

    .btn-acc-replay:disabled {
      background-color: #444;
      color: #999;
      cursor: not-allowed;
    }

    .btn-acc-delete {
      padding: 7px 14px;
      border: none;
      border-radius: 8px;
      background-color: var(--error-color);
      color: #fff;
      font-weight: bold;
      font-size: 0.82rem;
      cursor: pointer;
    }

    .backup-panel {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }

    .btn-backup {
      flex: 1;
      padding: 10px 8px;
      font-size: 0.82rem;
      font-weight: bold;
      border: 1px solid #444;
      border-radius: 10px;
      background-color: #252525;
      color: #fff;
      cursor: pointer;
    }

    .btn-backup:active { background-color: #333; }

    /* ==========================================
       グラフビュー
       ========================================== */
    .chart-controls {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
      flex-shrink: 0;
    }

    .btn-range {
      flex: 1;
      padding: 8px;
      font-size: 0.85rem;
      font-weight: bold;
      border: 1px solid #333;
      border-radius: 8px;
      background-color: var(--surface-color);
      color: var(--sub-text-color);
      cursor: pointer;
    }

    .btn-range.active {
      background-color: #2c3e50;
      border-color: var(--primary-color);
      color: #fff;
    }

    .chart-wrapper {
      flex: 1;
      min-height: 140px;
      background-color: var(--surface-color);
      border-radius: 12px;
      border: 1px solid #2c2c2c;
      padding: 8px;
      position: relative;
      margin-bottom: 8px;
    }

    .chart-stats-box {
      flex-shrink: 0;
      background-color: var(--surface-color);
      border-radius: 12px;
      border: 1px solid #2c2c2c;
      overflow: hidden;
    }

    .chart-stats-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.8rem;
    }

    .chart-stats-table th {
      background-color: #262626;
      padding: 7px 10px;
      text-align: right;
      color: var(--sub-text-color);
      cursor: default;
    }

    .chart-stats-table th:first-child { text-align: left; }

    .chart-stats-table td {
      padding: 7px 10px;
      text-align: right;
      border-bottom: 1px solid #2a2a2a;
      font-family: monospace;
      font-weight: bold;
      color: #fff;
    }

    .chart-stats-table td:first-child {
      text-align: left;
      font-family: sans-serif;
      color: var(--primary-color);
    }

    .chart-stats-table tr:last-child td { border-bottom: none; }
  </style>
</head>
<body>

  <!-- 上部バー -->
  <div class="top-bar">
    <div id="status-box" class="status-badge">未接続</div>
    <button id="reset-btn" class="btn-small btn-secondary">状態リセット</button>
    <button id="connect-btn" class="btn-small">接続</button>
  </div>

  <!-- タブ切り替え -->
  <div class="tab-bar">
    <button class="tab-btn active" id="tab-timer">タイマー</button>

    function resetStateArray(arr) {
      for (let f = 0; f < 6; f++) {

        }
      }
    }

    function statesEqual(a, b) {
      for (let i = 0; i < 54; i++) {
        if (a[i] !== b[i]) return false;
      }
      return true;
    }

    function rotateFaceCW(s, offset) {
      const t0 = s[offset], t1 = s[offset + 1], t2 = s[offset + 2];
      const t3 = s[offset + 3], t5 = s[offset + 5];
      const t6 = s[offset + 6], t7 = s[offset + 7], t8 = s[offset + 8];
      s[offset] = t6; s[offset + 1] = t3; s[offset + 2] = t0;
      s[offset + 3] = t7;                     s[offset + 5] = t1;
      s[offset + 6] = t8; s[offset + 7] = t5; s[offset + 8] = t2;
    }

    function cycle4(s, a, b, c, d) {
      for (let i = 0; i < 3; i++) {
        const tmp = s[d[i]];
        s[d[i]] = s[c[i]];
        s[c[i]] = s[b[i]];
        s[b[i]] = s[a[i]];
        s[a[i]] = tmp;
      }
    }

    function applyMoveCW(s, face) {
      switch (face) {
        case 'U': rotateFaceCW(s, 0); cycle4(s, [18, 19, 20], [36, 37, 38], [45, 46, 47], [9, 10, 11]); break;
        case 'R': rotateFaceCW(s, 9); cycle4(s, [20, 23, 26], [2, 5, 8], [51, 48, 45], [29, 32, 35]); break;
        case 'F': rotateFaceCW(s, 18); cycle4(s, [6, 7, 8], [9, 12, 15], [29, 28, 27], [44, 41, 38]); break;
        case 'D': rotateFaceCW(s, 27); cycle4(s, [24, 25, 26], [15, 16, 17], [51, 52, 53], [42, 43, 44]); break;
        case 'L': rotateFaceCW(s, 36); cycle4(s, [18, 21, 24], [27, 30, 33], [53, 50, 47], [0, 3, 6]); break;
        case 'B': rotateFaceCW(s, 45); cycle4(s, [2, 1, 0], [36, 39, 42], [33, 34, 35], [17, 14, 11]); break;
        case 'M': cycle4(s, [1, 4, 7], [19, 22, 25], [28, 31, 34], [52, 49, 46]); break;
        case 'x':
          applyMoveCW(s, 'R');
          applyMoveCW(s, 'M'); applyMoveCW(s, 'M'); applyMoveCW(s, 'M');
          applyMoveCW(s, 'L'); applyMoveCW(s, 'L'); applyMoveCW(s, 'L');
          break;
        case 'y':
          applyMoveCW(s, 'U');
          rotateFaceCW(s, 27); rotateFaceCW(s, 27); rotateFaceCW(s, 27);
          cycle4(s, [21, 22, 23], [39, 40, 41], [48, 49, 50], [12, 13, 14]);
          cycle4(s, [24, 25, 26], [42, 43, 44], [51, 52, 53], [15, 16, 17]);
          break;
        case 'z':
          applyMoveCW(s, 'F');
          rotateFaceCW(s, 45); rotateFaceCW(s, 45); rotateFaceCW(s, 45);
          cycle4(s, [3, 4, 5], [10, 13, 16], [32, 31, 30], [43, 40, 37]);
          cycle4(s, [0, 1, 2], [11, 14, 17], [35, 34, 33], [42, 39, 36]);
          break;
        case 'r':
          applyMoveCW(s, 'R');
          applyMoveCW(s, 'M'); applyMoveCW(s, 'M'); applyMoveCW(s, 'M');
          break;
        case 'f':
          applyMoveCW(s, 'z');
          applyMoveCW(s, 'B');
          break;
      }
    }

    function applyMoveToArray(s, move) {
      const face = move[0];
      if (move.endsWith("'")) {
        applyMoveCW(s, face); applyMoveCW(s, face); applyMoveCW(s, face);
      } else if (move.endsWith("2")) {
        applyMoveCW(s, face); applyMoveCW(s, face);
      } else {
        applyMoveCW(s, face);
      }
    }

    function isCubeSolvedArray(s) {
      for (let f = 0; f < 6; f++) {
        const base = f * 9;
        const color = s[base];
        for (let i = 1; i < 9; i++) {
          if (s[base + i] !== color) return false;
        }
      }
      return true;
    }

    function findShortestRecovery(currentState, targetState) {
      if (statesEqual(currentState, targetState)) return [];
      const queue = [{ state: currentState, path: [], lastFace: '' }];
      const visited = new Set([currentState.join(',')]);
      let head = 0;
      while (head < queue.length) {
        const { state, path, lastFace } = queue[head++];
        if (path.length >= 3) continue;
        for (const move of ALL_MOVES) {
          const face = move[0];
          if (face === lastFace) continue;
          const nextState = new Uint8Array(state);
          applyMoveToArray(nextState, move);
          const nextPath = [...path, move];
          if (statesEqual(nextState, targetState)) return nextPath;
          if (nextPath.length < 3) {
            const key = nextState.join(',');
            if (!visited.has(key)) {
              visited.add(key);
              queue.push({ state: nextState, path: nextPath, lastFace: face });
            }
          }
        }
      }
      return null;
    }

    function countHTM(moves) {
      const stack = [];
      for (const m of moves) {
        const face = m[0];
        const amt = m.endsWith("'") ? 3 : m.endsWith("2") ? 2 : 1;
        if (stack.length > 0 && stack[stack.length - 1].face === face) {
          const combined = (stack[stack.length - 1].amt + amt) % 4;
          if (combined === 0) stack.pop();
          else stack[stack.length - 1].amt = combined;
        } else {
          stack.push({ face, amt });
        }
      }
      return stack.length;
    }

      if (timeSec <= 0.005) return 0;
      return parseFloat((movesCount / timeSec).toFixed(2));

    function normalizeToCrossD(s, crossFace) {
      const norm = new Uint8Array(s);
      if (crossFace === 0) { applyMoveToArray(norm, 'x2'); }
      else if (crossFace === 1) { applyMoveToArray(norm, "z'"); }
      else if (crossFace === 2) { applyMoveToArray(norm, 'x'); }
      else if (crossFace === 4) { applyMoveToArray(norm, 'z'); }
      else if (crossFace === 5) { applyMoveToArray(norm, "x'"); }
      return norm;
    }

    function isUFaceSolved(s) {
      const c = s[4];
      for (let i = 0; i < 9; i++) {
        if (s[i] !== c) return false;
      }
      return true;
    }

    function detectOLLName(s, crossFace) {
      const norm = normalizeToCrossD(s, crossFace);
      if (isUFaceSolved(norm)) return 'OLL Skip';

      for (const c of OLL_CASES) {
        for (const preAuf of AUF_MOVES) {
          const test = new Uint8Array(norm);
          if (preAuf) applyMoveToArray(test, preAuf);
          for (const m of c.moves) applyMoveToArray(test, m);
          if (isUFaceSolved(test)) return c.name;
        }
      }
      return 'OLL';
    }

    function detectPLLName(s, crossFace) {
      const norm = normalizeToCrossD(s, crossFace);

      for (const auf of AUF_MOVES) {
        const test = new Uint8Array(norm);
        if (auf) applyMoveToArray(test, auf);
        if (isCubeSolvedArray(test)) return 'PLL Skip';
      }

      for (const [name, moves] of PLL_ALGS) {
        for (const preAuf of AUF_MOVES) {
          const base = new Uint8Array(norm);
          if (preAuf) applyMoveToArray(base, preAuf);
          for (const m of moves) applyMoveToArray(base, m);

          for (const postAuf of AUF_MOVES) {
            const test = new Uint8Array(base);
            if (postAuf) applyMoveToArray(test, postAuf);
            if (isCubeSolvedArray(test)) return name;
          }
        }
      }

      return 'PLL';
    }

    // ==========================================
    // CFOP法 ステップ別タイム＆手数/TPS分析エンジン
    // ==========================================
    const CROSS_DEFS = [
      [[1, 46, 49], [5, 10, 13], [7, 19, 22], [3, 37, 40]],
      [[10, 5, 4], [14, 48, 49], [16, 32, 31], [12, 23, 22]],
      [[19, 7, 4], [23, 12, 13], [25, 28, 31], [21, 41, 40]],
      [[28, 25, 22], [32, 16, 13], [34, 52, 49], [30, 43, 40]],
      [[37, 3, 4], [41, 21, 22], [43, 30, 31], [39, 50, 49]],
      [[46, 1, 4], [50, 39, 40], [52, 34, 31], [48, 14, 13]]
    ];

    const F2L_DEFS = [
      [[8, 4, 20, 23, 22, 9, 12, 13], [2, 4, 11, 14, 13, 45, 48, 49], [0, 4, 47, 50, 49, 36, 39, 40], [6, 4, 38, 41, 40, 18, 21, 22]],
      [[9, 13, 8, 7, 4, 20, 19, 22], [11, 13, 45, 46, 49, 2, 1, 4], [17, 13, 35, 34, 31, 51, 52, 49], [15, 13, 26, 25, 22, 29, 28, 31]],
      [[20, 22, 8, 5, 4, 9, 10, 13], [26, 22, 15, 16, 13, 29, 32, 31], [24, 22, 27, 30, 31, 44, 43, 40], [18, 22, 38, 37, 40, 6, 3, 4]],
      [[29, 31, 26, 23, 22, 15, 12, 13], [35, 31, 17, 14, 13, 51, 48, 49], [33, 31, 53, 50, 49, 42, 39, 40], [27, 31, 44, 41, 40, 24, 21, 22]],
      [[38, 40, 18, 19, 22, 6, 7, 4], [36, 40, 0, 1, 4, 47, 46, 49], [42, 40, 53, 52, 49, 33, 34, 31], [44, 40, 27, 28, 31, 24, 25, 22]],
      [[45, 49, 2, 5, 4, 11, 10, 13], [51, 49, 17, 16, 13, 35, 32, 31], [53, 49, 33, 30, 31, 42, 43, 40], [47, 49, 36, 37, 40, 0, 3, 4]]
    ];

    function isCrossSolved(s, f) {
      const centerColor = s[f * 9 + 4];
      for (const [dIdx, sIdx, cIdx] of CROSS_DEFS[f]) {
        if (s[dIdx] !== centerColor || s[sIdx] !== s[cIdx]) return false;
      }
      return true;
    }

    function countSolvedF2LSlots(s, f) {
      let count = 0;
      for (const [dc, dcen, s1c, s1e, s1cen, s2c, s2e, s2cen] of F2L_DEFS[f]) {
        if (s[dc] === s[dcen] && s[s1c] === s[s1cen] && s[s1e] === s[s1cen] && s[s2c] === s[s2cen] && s[s2e] === s[s2cen]) {
          count++;
        }
      }
      return count;
    }

    function isEOLLSolved(s, crossFace) {
      const llFace = OPPOSITE_FACE[crossFace];
      const base = llFace * 9;
      const color = s[base + 4];
      return s[base + 1] === color && s[base + 3] === color && s[base + 5] === color && s[base + 7] === color;
    }

    function isOLLSolved(s, crossFace) {
      const llFace = OPPOSITE_FACE[crossFace];
      const base = llFace * 9;
      const color = s[base + 4];
      for (let i = 0; i < 9; i++) {
        if (s[base + i] !== color) return false;
      }
      return true;
    }

    function isPLLSolved(s, crossFace) {
      const llFaceName = FACE_NAMES[OPPOSITE_FACE[crossFace]];
      const testState = new Uint8Array(s);
      for (let k = 0; k < 4; k++) {
        if (isCubeSolvedArray(testState)) return true;
        applyMoveCW(testState, llFaceName);
      }
      return false;
    }

    function analyzeCFOP(timeline, totalTime) {
      let crossFace = -1;
      let crossIdx = -1;
      const f2lIdxs = [];
      let eollIdx = -1;
      let ollIdx = -1;
      let pllIdx = -1;

      for (let i = 0; i < timeline.length; i++) {
        const { state } = timeline[i];
        if (crossFace === -1) {
          for (let f = 0; f < 6; f++) {
            if (isCrossSolved(state, f)) {
              crossFace = f;
              crossIdx = i;
              break;
            }
          }
          if (crossFace === -1) continue;
        }
        if (f2lIdxs.length < 4) {
          const solvedSlots = countSolvedF2LSlots(state, crossFace);
          while (f2lIdxs.length < solvedSlots) f2lIdxs.push(i);
          if (f2lIdxs.length < 4) continue;
        }
        if (eollIdx === -1) {
          if (isEOLLSolved(state, crossFace)) eollIdx = i;
        }
        if (ollIdx === -1) {
          if (isOLLSolved(state, crossFace)) ollIdx = i;
          else continue;
        }
        if (pllIdx === -1) {
          if (isPLLSolved(state, crossFace)) pllIdx = i;
        }
      }

      const lastIdx = timeline.length - 1;
      if (crossIdx === -1) crossIdx = lastIdx;
      while (f2lIdxs.length < 4) f2lIdxs.push(lastIdx);
      if (ollIdx === -1) ollIdx = lastIdx;
      if (eollIdx === -1 || eollIdx > ollIdx) eollIdx = ollIdx;
      if (pllIdx === -1) pllIdx = lastIdx;

      const getTimeAt = (idx) => (idx >= 0 && idx < timeline.length ? timeline[idx].time : totalTime);
      const getMovesSlice = (fromIdx, toIdx) => {
        if (toIdx <= fromIdx) return [];
        return timeline.slice(fromIdx + 1, toIdx + 1).map((s) => s.move);
      };

      const crossTime = getTimeAt(crossIdx);
      const f2lTimes = f2lIdxs.map(getTimeAt);
      const eollTime = getTimeAt(eollIdx);
      const ollTime = getTimeAt(ollIdx);
      const pllTime = getTimeAt(pllIdx);

      const crossDur = Math.max(0, crossTime);
      const f2l1Dur = Math.max(0, f2lTimes[0] - crossTime);
      const f2l2Dur = Math.max(0, f2lTimes[1] - f2lTimes[0]);
      const f2l3Dur = Math.max(0, f2lTimes[2] - f2lTimes[1]);
      const f2l4Dur = Math.max(0, f2lTimes[3] - f2lTimes[2]);
      const f2lTotal = Math.max(0, f2lTimes[3] - crossTime);
      const eollDur = Math.max(0, eollTime - f2lTimes[3]);
      const collDur = Math.max(0, ollTime - eollTime);
      const ollDur = Math.max(0, ollTime - f2lTimes[3]);
      const pllDur = Math.max(0, pllTime - ollTime);
      const aufDur = Math.max(0, totalTime - pllTime);

      const crossMoves = countHTM(getMovesSlice(-1, crossIdx));
      const f2l1Moves = countHTM(getMovesSlice(crossIdx, f2lIdxs[0]));
      const f2l2Moves = countHTM(getMovesSlice(f2lIdxs[0], f2lIdxs[1]));
      const f2l3Moves = countHTM(getMovesSlice(f2lIdxs[1], f2lIdxs[2]));
      const f2l4Moves = countHTM(getMovesSlice(f2lIdxs[2], f2lIdxs[3]));
      const f2lTotalMoves = countHTM(getMovesSlice(crossIdx, f2lIdxs[3]));
      const eollMoves = countHTM(getMovesSlice(f2lIdxs[3], eollIdx));
      const collMoves = countHTM(getMovesSlice(eollIdx, ollIdx));
      const ollMoves = countHTM(getMovesSlice(f2lIdxs[3], ollIdx));
      const pllMoves = countHTM(getMovesSlice(ollIdx, pllIdx));
      const aufMoves = countHTM(getMovesSlice(pllIdx, lastIdx));
      const totalMoves = countHTM(timeline.map((s) => s.move));

      const is2LookOll = ollIdx > eollIdx && collDur >= 0.01 && eollMoves > 0;
      const ollName = crossFace !== -1 ? detectOLLName(timeline[f2lIdxs[3]].state, crossFace) : 'OLL';
      const collName = is2LookOll && crossFace !== -1 ? detectOLLName(timeline[eollIdx].state, crossFace) : null;
      const pllName = crossFace !== -1 ? detectPLLName(timeline[ollIdx].state, crossFace) : 'PLL';

      return {
        crossFace: crossFace !== -1 ? FACE_NAMES[crossFace] : 'D',
        totalMoves,
        totalTps: calcTPS(totalMoves, totalTime),
        cross: parseFloat(crossDur.toFixed(2)),
        crossMoves,
        crossTps: calcTPS(crossMoves, crossDur),
        f2l: [
          parseFloat(f2l1Dur.toFixed(2)),
          parseFloat(f2l2Dur.toFixed(2)),
          parseFloat(f2l3Dur.toFixed(2)),
          parseFloat(f2l4Dur.toFixed(2))
        ],
        f2lMoves: [f2l1Moves, f2l2Moves, f2l3Moves, f2l4Moves],
        f2lTps: [
          calcTPS(f2l1Moves, f2l1Dur),
          calcTPS(f2l2Moves, f2l2Dur),
          calcTPS(f2l3Moves, f2l3Dur),
          calcTPS(f2l4Moves, f2l4Dur)
        ],
        f2lTotal: parseFloat(f2lTotal.toFixed(2)),
        f2lTotalMoves,
        f2lTotalTps: calcTPS(f2lTotalMoves, f2lTotal),
        ollName,
        collName,
        oll: parseFloat(ollDur.toFixed(2)),
        ollMoves,
        ollTps: calcTPS(ollMoves, ollDur),
        ollSkip: ollName === 'OLL Skip' || (ollDur < 0.01 && ollMoves === 0),
        is2LookOll,
        eoll: parseFloat(eollDur.toFixed(2)),
        eollMoves,
        eollTps: calcTPS(eollMoves, eollDur),
        coll: parseFloat(collDur.toFixed(2)),
        collMoves,
        collTps: calcTPS(collMoves, collDur),
        pllName,
        pll: parseFloat(pllDur.toFixed(2)),
        pllMoves,
        pllTps: calcTPS(pllMoves, pllDur),
        pllSkip: pllName === 'PLL Skip' || (pllDur < 0.01 && pllMoves === 0),
        auf: parseFloat(aufDur.toFixed(2)),
        aufMoves,
        aufTps: calcTPS(aufMoves, aufDur)
      };
    }

    function renderCFOP(cfop) {
      totalStatsEl.textContent = `${cfop.totalMoves}手 / ${cfop.totalTps.toFixed(2)} TPS`;
      totalStatsEl.style.display = 'block';

      const pllTotalTime = cfop.pll + cfop.auf;
      const pllTotalMoves = cfop.pllMoves + cfop.aufMoves;
      const pllTotalTps = calcTPS(pllTotalMoves, pllTotalTime);

      cfopSummaryEl.innerHTML = `
        <div class="cfop-card">

          <span class="cfop-label">PLL <span id="arrow-pll">▼</span></span>
          <span class="cfop-val ${cfop.pllSkip && cfop.auf < 0.01 ? 'cfop-skip' : ''}">${cfop.pllSkip && cfop.auf < 0.01 ? 'Skip' : pllTotalTime.toFixed(2) + 's'}</span>
          <span class="cfop-sub">${cfop.pllSkip && cfop.auf < 0.01 ? '-' : `${pllTotalMoves}手/${pllTotalTps.toFixed(1)}`}</span>
        </div>
      `;

      cfopDetailF2lEl.innerHTML = [0, 1, 2, 3].map((i) => `
        <div class="detail-row">
          <span>F2L Slot ${i + 1}</span>
          <span>${cfop.f2l[i].toFixed(2)}s (${cfop.f2lMoves[i]}手 / ${cfop.f2lTps[i].toFixed(2)} TPS)</span>
        </div>
      `).join('');

      cfopDetailOllEl.innerHTML = cfop.is2LookOll ? `
        <div class="detail-row">
          <span>エッジ (EOLL)</span>
          <span>${cfop.eoll.toFixed(2)}s (${cfop.eollMoves}手 / ${cfop.eollTps.toFixed(2)} TPS)</span>
        </div>
        <div class="detail-row">
          <span>${cfop.collName || 'コーナー (COLL)'}</span>
          <span>${cfop.coll.toFixed(2)}s (${cfop.collMoves}手 / ${cfop.collTps.toFixed(2)} TPS)</span>
        </div>
      ` : '';

      cfopDetailPllEl.innerHTML = `
        <div class="detail-row">
          <span>${cfop.pllName || 'PLL実行'}</span>
          <span class="${cfop.pllSkip ? 'cfop-skip' : ''}">${cfop.pllSkip ? '0.00s (Skip)' : `${cfop.pll.toFixed(2)}s (${cfop.pllMoves}手 / ${cfop.pllTps.toFixed(2)} TPS)`}</span>
        </div>
        <div class="detail-row">
          <span>AUF</span>
          <span>${cfop.auf.toFixed(2)}s (${cfop.aufMoves}手 / ${cfop.aufTps.toFixed(2)} TPS)</span>
        </div>
      `;

      cfopDetailF2lEl.classList.remove('open');
      cfopDetailOllEl.classList.remove('open');
      cfopDetailPllEl.classList.remove('open');

      const btnF2l = document.getElementById('btn-toggle-f2l');
      const btnOll = document.getElementById('btn-toggle-oll');
      const btnPll = document.getElementById('btn-toggle-pll');
      const arrowF2l = document.getElementById('arrow-f2l');
      const arrowOll = document.getElementById('arrow-oll');
      const arrowPll = document.getElementById('arrow-pll');

      function closeAllDetails() {
        cfopDetailF2lEl.classList.remove('open');
        cfopDetailOllEl.classList.remove('open');
        cfopDetailPllEl.classList.remove('open');
        btnF2l.classList.remove('active');
        btnOll.classList.remove('active');
        btnPll.classList.remove('active');
        arrowF2l.textContent = '▼';
        if (arrowOll) arrowOll.textContent = '▼';
        arrowPll.textContent = '▼';
      }

      btnF2l.addEventListener('click', () => {
        const wasOpen = cfopDetailF2lEl.classList.contains('open');
        closeAllDetails();
        if (!wasOpen) {
          cfopDetailF2lEl.classList.add('open');
          btnF2l.classList.add('active');
          arrowF2l.textContent = '▲';
        }
      });

      if (cfop.is2LookOll) {
        btnOll.addEventListener('click', () => {
          const wasOpen = cfopDetailOllEl.classList.contains('open');
          closeAllDetails();
          if (!wasOpen) {
            cfopDetailOllEl.classList.add('open');
            btnOll.classList.add('active');
            arrowOll.textContent = '▲';
          }
        });
      }

      btnPll.addEventListener('click', () => {
        const wasOpen = cfopDetailPllEl.classList.contains('open');
        closeAllDetails();
        if (!wasOpen) {
          cfopDetailPllEl.classList.add('open');
          btnPll.classList.add('active');
          arrowPll.textContent = '▲';

    // ==========================================
    // タイマー画面 右側統計ミニパネル更新
    // ==========================================
    function updateTimerStatsPanel() {

    // ==========================================
    // 27キュービー 3Dパーツ回転アニメーションエンジン
    // ==========================================
    const CUBIE_SIZE = 36;
    const cubies = [];

    function initCubeDOM() {
      for (let x = -1; x <= 1; x++) {
        for (let y = -1; y <= 1; y++) {
          for (let z = -1; z <= 1; z++) {
            const el = document.createElement('div');
            el.className = 'cubie';
            el.style.transform = `translate3d(${x * CUBIE_SIZE}px, ${y * CUBIE_SIZE}px, ${z * CUBIE_SIZE}px)`;

            const faces = {};
            ['U', 'R', 'F', 'D', 'L', 'B'].forEach((dir) => {
              const f = document.createElement('div');
              f.className = `cubie-face cf-${dir}`;
              el.appendChild(f);
              faces[dir] = f;
            });

            cubeOrientation.appendChild(el);
            cubies.push({ el, x, y, z, faces });
          }
        }
      }
    }

    function syncCubieColors() {
      cubies.forEach(({ x, y, z, faces }) => {
        faces.U.style.backgroundColor = y === -1 ? COLORS[cubeState[0 + (z + 1) * 3 + (x + 1)]] : '#111';
        faces.D.style.backgroundColor = y === 1 ? COLORS[cubeState[27 + (1 - z) * 3 + (x + 1)]] : '#111';
        faces.F.style.backgroundColor = z === 1 ? COLORS[cubeState[18 + (y + 1) * 3 + (x + 1)]] : '#111';
        faces.B.style.backgroundColor = z === -1 ? COLORS[cubeState[45 + (y + 1) * 3 + (1 - x)]] : '#111';
        faces.R.style.backgroundColor = x === 1 ? COLORS[cubeState[9 + (y + 1) * 3 + (1 - z)]] : '#111';
        faces.L.style.backgroundColor = x === -1 ? COLORS[cubeState[36 + (y + 1) * 3 + (z + 1)]] : '#111';
      });
    }

    let animTimeout = null;

    function finishAnimationNow() {
      if (animTimeout !== null) {
        clearTimeout(animTimeout);
        animTimeout = null;
      }
      turnLayer.style.transition = 'none';
      turnLayer.style.transform = 'none';
      while (turnLayer.firstChild) {
        cubeOrientation.appendChild(turnLayer.firstChild);
      }
      syncCubieColors();
    }

    function animateMove3D(move, durationMs = 70) {
      finishAnimationNow();

      const face = move[0];
      const isPrime = move.endsWith("'");
      const angle = isPrime ? 90 : -90;

      let filterFn;
      let transformStr = '';

      switch (face) {
        case 'U': filterFn = (c) => c.y === -1; transformStr = `rotateY(${angle}deg)`; break;
        case 'D': filterFn = (c) => c.y === 1; transformStr = `rotateY(${-angle}deg)`; break;
        case 'R': filterFn = (c) => c.x === 1; transformStr = `rotateX(${-angle}deg)`; break;
        case 'L': filterFn = (c) => c.x === -1; transformStr = `rotateX(${angle}deg)`; break;
        case 'F': filterFn = (c) => c.z === 1; transformStr = `rotateZ(${-angle}deg)`; break;
        case 'B': filterFn = (c) => c.z === -1; transformStr = `rotateZ(${angle}deg)`; break;
      }

      cubies.filter(filterFn).forEach((c) => turnLayer.appendChild(c.el));
      void turnLayer.offsetWidth;
      turnLayer.style.transition = `transform ${durationMs}ms ease-out`;
      turnLayer.style.transform = transformStr;

      animTimeout = setTimeout(() => {
        finishAnimationNow();
      }, durationMs + 5);
    }

    let rotX = -25;
    let rotY = -35;
    let isDragging = false;
    let lastX = 0;
    let lastY = 0;

    cubeContainer.addEventListener('pointerdown', (e) => {
      isDragging = true;
      lastX = e.clientX;
      lastY = e.clientY;
    });

    window.addEventListener('pointermove', (e) => {
      if (!isDragging) return;
      const dx = e.clientX - lastX;
      const dy = e.clientY - lastY;
      rotY += dx * 0.6;
      rotX -= dy * 0.6;
      cube3d.style.transform = `rotateX(${rotX}deg) rotateY(${rotY}deg)`;
      lastX = e.clientX;
      lastY = e.clientY;
    });

    window.addEventListener('pointerup', () => {
      isDragging = false;
    });

    // ==========================================
    // リプレイ機能
    // ==========================================
    let replayData = null;
    let replayBaseState = null;
    let replayPlaying = false;
    let replaySpeed = 1.0;
    let replayCurrentTime = 0;
    let replayMoveIndex = 0;
    let replayRafId = null;
    let replayLastFrameTime = 0;
    let replayReturnTarget = 'timer';
    let replayHistoryScrollTop = 0;

    function setCrossOrientation(crossFace) {
      let transform = 'none';
      switch (crossFace) {
        case 'U': transform = 'rotateX(180deg)'; break;
        case 'F': transform = 'rotateX(-90deg)'; break;
        case 'B': transform = 'rotateX(90deg)'; break;
        case 'R': transform = 'rotateZ(90deg)'; break;
        case 'L': transform = 'rotateZ(-90deg)'; break;
        case 'D': default: transform = 'none'; break;
      }
      cubeOrientation.style.transform = transform;
      rotX = -25;
      rotY = -35;
      cube3d.style.transform = `rotateX(${rotX}deg) rotateY(${rotY}deg)`;
    }

    function buildSeekbarSegments(cfop, totalTime) {
      seekbarTrack.innerHTML = '';
      if (totalTime <= 0) return;

      const pllTotal = cfop.pll + cfop.auf;
      const segments = [
        { dur: cfop.cross, color: '#2196f3' },
        { dur: cfop.f2lTotal, color: '#4caf50' },
        { dur: cfop.oll, color: '#ffc107' },
        { dur: pllTotal, color: '#f44336' }
      ];

      segments.forEach((seg) => {
        const pct = (seg.dur / totalTime) * 100;
        const div = document.createElement('div');
        div.style.width = `${pct}%`;
        div.style.height = '100%';
        div.style.backgroundColor = seg.color;
        seekbarTrack.appendChild(div);
      });
    }

    function getPhaseAtTime(t, cfop) {
      if (t <= cfop.cross) return { name: 'Cross', color: '#2196f3' };
      if (t <= cfop.cross + cfop.f2lTotal) return { name: 'F2L', color: '#4caf50' };
      if (t <= cfop.cross + cfop.f2lTotal + cfop.oll) return { name: 'OLL', color: '#ffc107' };
      return { name: 'PLL', color: '#f44336' };
    }

    function seekReplayTo(targetTime) {
      if (!replayData) return;
      finishAnimationNow();

      replayCurrentTime = Math.max(0, Math.min(targetTime, replayData.time));
      cubeState = new Uint8Array(replayBaseState);
      replayMoveIndex = 0;

      const tl = replayData.timeline;
      while (replayMoveIndex < tl.length && tl[replayMoveIndex].time <= replayCurrentTime) {
        applyMoveToArray(cubeState, tl[replayMoveIndex].move);
        replayMoveIndex++;
      }

      syncCubieColors();
      updateReplayUI();
    }

    function updateReplayUI() {
      if (!replayData) return;
      const total = replayData.time;
      const pct = total > 0 ? (replayCurrentTime / total) * 100 : 0;
      seekbarThumb.style.left = `${pct}%`;
      replayTimeEl.textContent = `${replayCurrentTime.toFixed(2)} / ${total.toFixed(2)}s`;

      const phase = getPhaseAtTime(replayCurrentTime, replayData.cfop);
      replayPhaseEl.textContent = phase.name;
      replayPhaseEl.style.backgroundColor = phase.color;
      replayPhaseEl.style.color = phase.name === 'OLL' ? '#000' : '#fff';

      const lastMove = replayMoveIndex > 0 ? replayData.timeline[replayMoveIndex - 1].move : '-';
      replayMoveEl.textContent = lastMove;
    }

    function replayLoop(now) {
      if (!replayPlaying) return;
      const dt = ((now - replayLastFrameTime) / 1000) * replaySpeed;
      replayLastFrameTime = now;
      replayCurrentTime += dt;

      const tl = replayData.timeline;
      while (replayMoveIndex < tl.length && tl[replayMoveIndex].time <= replayCurrentTime) {
        const m = tl[replayMoveIndex].move;
        applyMoveToArray(cubeState, m);

        let durMs = 70;
        if (replayMoveIndex + 1 < tl.length) {
          const nextGapMs = ((tl[replayMoveIndex + 1].time - tl[replayMoveIndex].time) * 1000) / replaySpeed;
          durMs = Math.max(20, Math.min(70, Math.floor(nextGapMs * 0.7)));
        }
        animateMove3D(m, durMs);
        replayMoveIndex++;
      }

      if (replayCurrentTime >= replayData.time) {
        replayCurrentTime = replayData.time;
        replayPlaying = false;
        replayPlayBtn.textContent = '▶ 再生';
        updateReplayUI();
        return;
      }

      updateReplayUI();
      replayRafId = requestAnimationFrame(replayLoop);
    }

    function toggleReplayPlay() {
      if (!replayData) return;
      if (replayPlaying) {
        replayPlaying = false;
        if (replayRafId) cancelAnimationFrame(replayRafId);
        replayPlayBtn.textContent = '▶ 再生';
      } else {
        if (replayCurrentTime >= replayData.time) {
          seekReplayTo(0);
        }
        replayPlaying = true;
        replayPlayBtn.textContent = '❚❚ 一時停止';
        replayLastFrameTime = performance.now();
        replayRafId = requestAnimationFrame(replayLoop);
      }
    }

    function startReplay(solveData, source = 'timer') {
      if (!solveData.timeline || solveData.timeline.length === 0) return;
      replayReturnTarget = source;
      if (source === 'history') {
        replayHistoryScrollTop = tableWrapper.scrollTop;
      }

      switchTab('timer');
      appState = 'REPLAY';
      replayData = solveData;
      replayPlaying = false;
      if (replayRafId) cancelAnimationFrame(replayRafId);

      replayBaseState = new Uint8Array(54);
      resetStateArray(replayBaseState);
      const sMoves = solveData.scramble.split(' ').filter(Boolean);
      for (const m of sMoves) {
        applyMoveToArray(replayBaseState, m);
      }

      setCrossOrientation(solveData.cfop.crossFace);
      buildSeekbarSegments(solveData.cfop, solveData.time);

      scrambleBox.style.display = 'none';
      timerBox.style.display = 'none';
      replayScrambleBox.textContent = `Scramble: ${solveData.scramble}`;
      replayScrambleBox.style.display = 'block';
      replayPanel.style.display = 'block';
      replayPlayBtn.textContent = '▶ 再生';

      seekReplayTo(0);
    }

    function exitReplay() {
      replayPlaying = false;
      if (replayRafId) cancelAnimationFrame(replayRafId);
      setCrossOrientation('D');
      replayPanel.style.display = 'none';
      replayScrambleBox.style.display = 'none';
      scrambleBox.style.display = 'block';
      timerBox.style.display = 'block';
      resetCubeState();
      generateNewScramble();

      if (replayReturnTarget === 'history') {
        switchTab('history');
        tableWrapper.scrollTop = replayHistoryScrollTop;
      }
    }

    let isSeeking = false;
    function handleSeekPointer(e) {
      const rect = seekbarWrapper.getBoundingClientRect();
      const ratio = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
      seekReplayTo(ratio * replayData.time);
    }

    seekbarWrapper.addEventListener('pointerdown', (e) => {
      if (!replayData) return;
      isSeeking = true;
      if (replayPlaying) toggleReplayPlay();
      handleSeekPointer(e);
    });

    window.addEventListener('pointermove', (e) => {
      if (isSeeking) handleSeekPointer(e);
    });

    window.addEventListener('pointerup', () => {
      isSeeking = false;
    });

    replayPlayBtn.addEventListener('click', toggleReplayPlay);

    const SPEEDS = [1.0, 0.5, 0.25];
    let speedIdx = 0;
    replaySpeedBtn.addEventListener('click', () => {
      speedIdx = (speedIdx + 1) % SPEEDS.length;
      replaySpeed = SPEEDS[speedIdx];
      replaySpeedBtn.textContent = `${replaySpeed.toFixed(replaySpeed === 0.25 ? 2 : 1)}x`;
    });

    replayExitBtn.addEventListener('click', exitReplay);
    replayStartBtn.addEventListener('click', () => {
      if (lastSolveData) startReplay(lastSolveData, 'timer');
    });

    deleteLastBtn.addEventListener('click', () => {
      if (!lastSolveData) return;
      if (confirm('直前の記録を削除します。よろしいですか？')) {
        const updated = getHistory().filter((h) => h.id !== lastSolveData.id);
        saveHistoryWithCleanup(updated);
        lastSolveData = null;
        generateNewScramble();
      }
    });

    // ==========================================
    // 履歴一覧・4項目ソート・容量軽量化・バックアップ
    // ==========================================
    function getHistory() {
      return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
    }

    function saveHistoryWithCleanup(history) {
      const cutoff = history.length - MAX_REPLAY_COUNT;
      for (let i = 0; i < cutoff; i++) {
        if (history[i].timeline !== null) history[i].timeline = null;
        if (history[i].moves !== null) history[i].moves = null;
      }
      localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
      updateSolveCount();
      updateTimerStatsPanel();
    }

    function calcAoNWindow(slice) {
      const sorted = [...slice].sort((a, b) => a - b);
      const trimmed = sorted.slice(1, -1);
      return trimmed.reduce((acc, v) => acc + v, 0) / trimmed.length;
    }

    function calcAoStats(times, n) {
      if (times.length < n) return { current: null, best: null };
      let best = Infinity;
      let current = null;
      for (let i = 0; i <= times.length - n; i++) {
        const val = calcAoNWindow(times.slice(i, i + n));
        if (val < best) best = val;
        if (i === times.length - n) current = val;
      }
      return { current, best };
    }

    function formatShortDate(iso) {
      const d = new Date(iso);
      const m = d.getMonth() + 1;
      const day = d.getDate();
      const hh = String(d.getHours()).padStart(2, '0');
      const mm = String(d.getMinutes()).padStart(2, '0');
      return `${m}/${day} ${hh}:${mm}`;
    }

    function getSortValue(item, key) {
      const cfop = item.cfop || {};
      switch (key) {
        case 'date': return new Date(item.date).getTime();
        case 'time': return item.time;
        case 'moves': return cfop.totalMoves ?? 0;
        case 'tps': return cfop.totalTps ?? 0;
        default: return 0;
      }
    }

    function makeAccLine(name, time, step, tps, isIndent = false) {
      const tStr = time !== undefined ? `${time.toFixed(2)}s` : '-';
      const sStr = step !== undefined ? `${step}` : '-';
      const pStr = tps !== undefined ? `${tps.toFixed(2)}` : '-';
      return `
        <div class="acc-line ${isIndent ? 'indent' : ''}">
          <span class="acc-name">${name}</span>
          <span>Time:<span class="num-time">${tStr}</span></span>
          <span>Step:<span class="num-step">${sStr}</span></span>
          <span>TPS:<span class="num-tps">${pStr}</span></span>
        </div>
      `;
    }

    function renderHistoryView() {
      const history = getHistory();
      tabHistoryBtn.textContent = `履歴 (${history.length}件)`;

      if (history.length === 0) {
        historyTbody.innerHTML = '<tr><td colspan="4" style="text-align:center; padding:24px; color:#777;">まだ記録がありません</td></tr>';
        return;
      }

      const sorted = [...history].sort((a, b) => {
        const va = getSortValue(a, sortKey);
        const vb = getSortValue(b, sortKey);
        return sortAsc ? va - vb : vb - va;
      });

      historyTbody.innerHTML = '';
      sorted.forEach((item) => {
        const cfop = item.cfop || {};
        const isExpanded = item.id === expandedSolveId;

        const tr = document.createElement('tr');
        tr.className = 'history-row' + (isExpanded ? ' selected' : '');
        tr.innerHTML = `
          <td>${formatShortDate(item.date)}</td>
          <td style="font-weight:bold; color:#fff;">${item.time.toFixed(2)}s</td>
          <td>${cfop.totalMoves ?? '-'}手</td>
          <td>${cfop.totalTps !== undefined ? cfop.totalTps.toFixed(2) : '-'}</td>
        `;
        tr.addEventListener('click', () => {
          expandedSolveId = isExpanded ? null : item.id;
          renderHistoryView();
        });
        historyTbody.appendChild(tr);

        if (isExpanded) {
          const accTr = document.createElement('tr');
          accTr.className = 'accordion-row';
          const hasReplay = Array.isArray(item.timeline) && item.timeline.length > 0;

          const pllTotalTime = (cfop.pll ?? 0) + (cfop.auf ?? 0);
          const pllTotalMoves = (cfop.pllMoves ?? 0) + (cfop.aufMoves ?? 0);
          const pllTotalTps = calcTPS(pllTotalMoves, pllTotalTime);

          let linesHtml = '';
          linesHtml += makeAccLine(`Cross(${cfop.crossFace || '-'})`, cfop.cross, cfop.crossMoves, cfop.crossTps, false);
          linesHtml += makeAccLine('F2L', cfop.f2lTotal, cfop.f2lTotalMoves, cfop.f2lTotalTps, false);
          for (let i = 0; i < 4; i++) {
            linesHtml += makeAccLine(`Slot${i + 1}`, cfop.f2l?.[i], cfop.f2lMoves?.[i], cfop.f2lTps?.[i], true);
          }
          linesHtml += makeAccLine(cfop.ollName || 'OLL', cfop.oll, cfop.ollMoves, cfop.ollTps, false);
          if (cfop.is2LookOll) {
            linesHtml += makeAccLine('EOLL', cfop.eoll, cfop.eollMoves, cfop.eollTps, true);
            linesHtml += makeAccLine(cfop.collName || 'COLL', cfop.coll, cfop.collMoves, cfop.collTps, true);
          }
          linesHtml += makeAccLine('PLL', pllTotalTime, pllTotalMoves, pllTotalTps, false);
          linesHtml += makeAccLine(cfop.pllName || 'PLL実行', cfop.pll, cfop.pllMoves, cfop.pllTps, true);
          linesHtml += makeAccLine('AUF', cfop.auf, cfop.aufMoves, cfop.aufTps, true);

          accTr.innerHTML = `
            <td colspan="4">
              <div class="acc-content">
                <div class="acc-list">${linesHtml}</div>
                <div class="acc-actions">
                  <button class="btn-acc-replay" ${hasReplay ? '' : 'disabled'}>${hasReplay ? '▶ リプレイ再生' : 'リプレイ期限切れ（100件超過）'}</button>
                  <button class="btn-acc-delete">🗑 削除</button>
                </div>
              </div>
            </td>
          `;

          if (hasReplay) {
            accTr.querySelector('.btn-acc-replay').addEventListener('click', (e) => {
              e.stopPropagation();
              startReplay(item, 'history');
            });
          }

          accTr.querySelector('.btn-acc-delete').addEventListener('click', (e) => {
            e.stopPropagation();
            if (confirm('1件の記録を削除します。よろしいですか？')) {
              const updated = getHistory().filter((h) => h.id !== item.id);
              saveHistoryWithCleanup(updated);
              expandedSolveId = null;
              renderHistoryView();
            }
          });

          historyTbody.appendChild(accTr);
        }
      });
    }

    document.querySelectorAll('th[data-sort]').forEach((th) => {
      th.addEventListener('click', () => {
        const key = th.dataset.sort;
        if (sortKey === key) {
          sortAsc = !sortAsc;
        } else {
          sortKey = key;
          sortAsc = key !== 'date' && key !== 'tps';
        }

        document.querySelectorAll('th[data-sort]').forEach((el) => {
          el.classList.remove('sort-active');
          el.textContent = el.textContent.replace(/ [▲▼]/g, '');
        });
        th.classList.add('sort-active');
        th.textContent += sortAsc ? ' ▲' : ' ▼';

        renderHistoryView();
      });
    });

    btnExport.addEventListener('click', () => {
      const history = getHistory();
      const now = new Date();
      const y = now.getFullYear();
      const m = String(now.getMonth() + 1).padStart(2, '0');
      const d = String(now.getDate()).padStart(2, '0');
      const filename = `gan-timer-backup-${y}${m}${d}.json`;

      const blob = new Blob([JSON.stringify(history, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      a.click();
      URL.revokeObjectURL(url);
    });

    btnImport.addEventListener('click', () => {
      importFileInput.value = '';
      importFileInput.click();
    });

    importFileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (ev) => {
        try {
          const imported = JSON.parse(ev.target.result);
          if (!Array.isArray(imported)) throw new Error('Invalid format');

          const merge = confirm('現在のデータに統合しますか？\n\n[OK] ＝ 重複を除外して統合\n[キャンセル] ＝ 現在のデータを上書き復元');
          if (merge) {
            const current = getHistory();
            const existingIds = new Set(current.map((item) => item.id));
            const merged = [...current, ...imported.filter((item) => !existingIds.has(item.id))];
            merged.sort((a, b) => new Date(a.date).getTime() - new Date(b.date).getTime());
            saveHistoryWithCleanup(merged);
            alert(`${imported.length}件のバックアップを統合しました。`);
          } else {
            if (confirm('本当に現在のデータをすべて上書きしますか？')) {
              saveHistoryWithCleanup(imported);
              alert(`${imported.length}件のデータを復元しました。`);
            }
          }
          renderHistoryView();
        } catch (err) {
          alert('バックアップファイルの読み込みに失敗しました。');
        }
      };
      reader.readAsText(file);
    });

    // ==========================================
    // タイム推移グラフ (Chart.js) & 詳細統計表
    // ==========================================
    function calcMovingAoN(times, n) {
      return times.map((_, idx) => {
        if (idx < n - 1) return null;
        return parseFloat(calcAoNWindow(times.slice(idx - n + 1, idx + 1)).toFixed(2));
      });
    }

    function renderChartView() {
      const history = getHistory();
      const todayStr = new Date().toDateString();
      const todayHistory = history.filter((h) => new Date(h.date).toDateString() === todayStr);

      const targetData = chartMode === 'today' ? todayHistory : history;
      const labels = targetData.map((_, idx) => `#${idx + 1}`);
      const times = targetData.map((h) => h.time);

      const datasets = [
        {
          label: '単発',
          data: times,
          borderColor: 'rgba(158, 158, 158, 0.5)',
          backgroundColor: 'rgba(158, 158, 158, 0.5)',
          borderWidth: 1.5,
          pointRadius: 2.5,
          tension: 0.1
        }
      ];

      if (chartMode === 'today') {
        datasets.push(
          {
            label: 'Ao5',
            data: calcMovingAoN(times, 5),
            borderColor: '#2196f3',
            backgroundColor: '#2196f3',
            borderWidth: 2.5,
            pointRadius: 0,
            tension: 0.2
          },
          {
            label: 'Ao12',
            data: calcMovingAoN(times, 12),
            borderColor: '#ff9800',
            backgroundColor: '#ff9800',
            borderWidth: 2.5,
            pointRadius: 0,
            tension: 0.2
          }
        );
      } else {
        datasets.push(
          {
            label: 'Ao50',
            data: calcMovingAoN(times, 50),
            borderColor: '#4caf50',
            backgroundColor: '#4caf50',
            borderWidth: 2.5,
            pointRadius: 0,
            tension: 0.2
          },
          {
            label: 'Ao100',
            data: calcMovingAoN(times, 100),
            borderColor: '#e91e63',
            backgroundColor: '#e91e63',
            borderWidth: 2.5,
            pointRadius: 0,
            tension: 0.2
          }
        );
      }

      const ctx = document.getElementById('solve-chart').getContext('2d');
      if (chartInstance) {
        chartInstance.destroy();
      }

      chartInstance = new Chart(ctx, {
        type: 'line',
        data: { labels, datasets },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          interaction: { mode: 'index', intersect: false },
          plugins: {
            legend: {
              labels: { color: '#ccc', boxWidth: 12 }
            }
          },
          scales: {
            x: {
              ticks: { color: '#888', maxTicksLimit: 8 },
              grid: { color: '#2a2a2a' }
            },
            y: {
              ticks: { color: '#888' },
              grid: { color: '#2a2a2a' }
            }
          }
        }
      });

      const allTimes = history.map((h) => h.time);
      const todayTimes = todayHistory.map((h) => h.time);
      const fmt = (val) => (val !== null ? `${val.toFixed(2)}s` : '-');

      const singleCurrent = allTimes.length > 0 ? allTimes[allTimes.length - 1] : null;
      const singleToday = todayTimes.length > 0 ? Math.min(...todayTimes) : null;
      const singleAll = allTimes.length > 0 ? Math.min(...allTimes) : null;

      let rowsHtml = `
        <tr>
          <td>Single</td>
          <td>${fmt(singleCurrent)}</td>
          <td>${fmt(singleToday)}</td>
          <td>${fmt(singleAll)}</td>
        </tr>
      `;

      [5, 12, 50, 100].forEach((n) => {
        const allStats = calcAoStats(allTimes, n);
        const todayStats = calcAoStats(todayTimes, n);
        rowsHtml += `
          <tr>
            <td>Ao${n}</td>
            <td>${fmt(allStats.current)}</td>
            <td>${fmt(todayStats.best)}</td>
            <td>${fmt(allStats.best)}</td>
          </tr>
        `;
      });

      rowsHtml += `
        <tr>
          <td>ソルブ数</td>
          <td>-</td>
          <td>${todayTimes.length}</td>
          <td>${allTimes.length}</td>
        </tr>
      `;

      chartStatsTbody.innerHTML = rowsHtml;
    }

    document.querySelectorAll('.btn-range').forEach((btn) => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.btn-range').forEach((b) => b.classList.remove('active'));
        btn.classList.add('active');
        chartMode = btn.dataset.mode;
        renderChartView();
      });
    });

    // ==========================================
    // メインロジック
    // ==========================================
    function resetCubeState() {
      finishAnimationNow();
      resetStateArray(cubeState);
      syncCubieColors();
    }

    function init() {
      initCubeDOM();
      resetCubeState();
      updateSolveCount();
      updateTimerStatsPanel();
      generateNewScramble();
    }

    function updateSolveCount() {
      const history = getHistory();
      tabHistoryBtn.textContent = `履歴 (${history.length}件)`;
    }

    function getInverseMove(move) {
      if (move.endsWith("'")) return move.slice(0, -1);
      if (move.endsWith("2")) return move;
      return move + "'";
    }

    function generateNewScramble() {
      const faces = ['U', 'D', 'L', 'R', 'F', 'B'];
      const modifiers = ['', "'", '2'];
      const axis = { U: 0, D: 0, L: 1, R: 1, F: 2, B: 2 };

      const moves = [];
      let lastFace = '';
      let secondLastFace = '';

      while (moves.length < 20) {
        const face = faces[Math.floor(Math.random() * faces.length)];
        if (face === lastFace) continue;
        if (secondLastFace && axis[face] === axis[lastFace] && face === secondLastFace) continue;

        const mod = modifiers[Math.floor(Math.random() * modifiers.length)];
        moves.push(face + mod);
        secondLastFace = lastFace;
        lastFace = face;
      }

      scrambleMoves = moves;
      scrambleIndex = 0;
      halfTurnMove = null;
      isScrambleError = false;
      recoveryGuideText = '';

      gestureMove = null;
      gestureInvalid = false;

      expectedStates = [new Uint8Array(cubeState)];
      let simState = new Uint8Array(cubeState);
      for (const m of scrambleMoves) {
        applyMoveToArray(simState, m);
        expectedStates.push(new Uint8Array(simState));
      }

      cfopPanelEl.style.display = 'none';
      totalStatsEl.style.display = 'none';
      replayStartBtn.style.display = 'none';
      deleteLastBtn.style.display = 'none';
      gestureHintEl.style.display = 'none';
      setAppState('SCRAMBLE');
      stopTimer();
      timerDisplayEl.textContent = '0.00';
      renderScramble();
    }

    function renderScramble() {
      scrambleMovesEl.innerHTML = '';
      scrambleMoves.forEach((move, idx) => {
        const span = document.createElement('span');
        span.className = 's-move';
        span.textContent = move;
        if (idx < scrambleIndex) {
          span.classList.add('done');
        } else if (idx === scrambleIndex && !isScrambleError) {
          span.classList.add('current');
        }
        scrambleMovesEl.appendChild(span);
      });

      correctionGuideEl.textContent = isScrambleError ? recoveryGuideText : '';
    }

    function setAppState(newState) {
      appState = newState;
      timerStateEl.textContent = newState;
      timerStateEl.className = '';
      if (newState === 'READY') timerStateEl.classList.add('state-ready');
      if (newState === 'SOLVING') timerStateEl.classList.add('state-solving');
      if (newState === 'SOLVED') timerStateEl.classList.add('state-solved');
    }

    function startTimer() {
      startTime = performance.now();
      timerInterval = setInterval(() => {
        const elapsed = (performance.now() - startTime) / 1000;
        timerDisplayEl.textContent = elapsed.toFixed(2);
      }, 10);
    }

    function stopTimer() {
      if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
      }
    }

    function saveSolve(timeSec, cfopResult) {
      const solveObj = {
        id: Date.now(),
        date: new Date().toISOString(),
        time: timeSec,
        scramble: scrambleMoves.join(' '),
        moves: solveMoves,
        timeline: solveTimeline.map((s) => ({ move: s.move, time: s.time })),
        cfop: cfopResult
      };
      lastSolveData = solveObj;

      const history = getHistory();
      history.push(solveObj);
      saveHistoryWithCleanup(history);
    }

    function handleMove(move) {
      if (appState === 'REPLAY') return;

      const wasSolvedBefore = isCubeSolvedArray(cubeState);
      applyMoveToArray(cubeState, move);

      if (appState === 'SOLVED') {
        animateMove3D(move);

        if (gestureMove === null) {
          if (wasSolvedBefore && !gestureInvalid) {
            gestureMove = move;
            gestureTime = performance.now();
          }
        } else {
          const elapsed = performance.now() - gestureTime;
          if (!gestureInvalid && elapsed <= 2000 && move === getInverseMove(gestureMove)) {
            gestureMove = null;
            generateNewScramble();
            return;
          } else {
            gestureMove = null;
            gestureInvalid = true;
          }
        }

        if (isCubeSolvedArray(cubeState)) {
          gestureInvalid = false;
        }
        return;
      }

      if (appState === 'READY') {
        solveMoves = [move];
        solveTimeline = [{ move, time: 0, state: new Uint8Array(cubeState) }];
        setAppState('SOLVING');
        startTimer();
        checkSolved();
      } else if (appState === 'SOLVING') {
        const elapsed = (performance.now() - startTime) / 1000;
        solveMoves.push(move);
        solveTimeline.push({ move, time: elapsed, state: new Uint8Array(cubeState) });
        checkSolved();
      } else if (appState === 'SCRAMBLE') {
        let matchedIdx = -1;
        for (let i = expectedStates.length - 1; i >= 0; i--) {
          if (statesEqual(cubeState, expectedStates[i])) {
            matchedIdx = i;
            break;
          }
        }

        if (matchedIdx !== -1) {
          scrambleIndex = matchedIdx;
          halfTurnMove = null;
          isScrambleError = false;
          recoveryGuideText = '';
          if (scrambleIndex >= scrambleMoves.length) {
            setAppState('READY');
          }
        } else {
          const expectedMove = scrambleMoves[scrambleIndex];
          if (!isScrambleError && expectedMove && expectedMove.endsWith('2') && halfTurnMove === null && (move === expectedMove[0] || move === expectedMove[0] + "'")) {
            halfTurnMove = move;
          } else {
            halfTurnMove = null;
            isScrambleError = true;
            const path = findShortestRecovery(cubeState, expectedStates[scrambleIndex]);
            if (path && path.length > 0) {
              recoveryGuideText = `間違い！戻してください → ${path.join(' ')}`;
            } else {
              recoveryGuideText = '大きくズレました（状態リセット推奨）';
            }
          }
        }
        renderScramble();
      }

      animateMove3D(move);
    }

    function checkSolved() {
      if (isCubeSolvedArray(cubeState)) {
        stopTimer();
        const finalTime = parseFloat(((performance.now() - startTime) / 1000).toFixed(2));
        timerDisplayEl.textContent = finalTime.toFixed(2);
        setAppState('SOLVED');

        gestureMove = null;
        gestureInvalid = false;
        gestureHintEl.style.display = 'block';

        const cfopResult = analyzeCFOP(solveTimeline, finalTime);
        renderCFOP(cfopResult);
        saveSolve(finalTime, cfopResult);
        replayStartBtn.style.display = 'block';
        deleteLastBtn.style.display = 'block';
      }
    }

    resetBtn.addEventListener('click', () => {
      if (appState === 'REPLAY') exitReplay();
      else {
        resetCubeState();
        generateNewScramble();
      }
    });

    nextScrambleBtn.addEventListener('click', () => {
      generateNewScramble();
    });

    function updateStatus(text, type) {
      statusBox.textContent = text;
      statusBox.className = `status-badge status-${type}`;
    }

    connectBtn.addEventListener('click', async () => {
      if (cubeConnection) {
        try { await cubeConnection.disconnect(); } catch (e) {}
        cubeConnection = null;
        updateStatus('未接続', 'disconnected');
        connectBtn.textContent = '接続';
        connectBtn.classList.remove('btn-disconnect');
        return;
      }

      if (!navigator.bluetooth) {
        updateStatus('Web Bluetooth非対応', 'error');
        return;
      }

      try {
        updateStatus('接続中...', 'connecting');
        connectBtn.disabled = true;

        cubeConnection = await connectGanCube();
        updateStatus(`接続済: ${cubeConnection.deviceName || 'GAN'}`, 'connected');
        connectBtn.textContent = '切断';
        connectBtn.classList.add('btn-disconnect');
        connectBtn.disabled = false;

        cubeConnection.events$.subscribe((event) => {
          if (event.type === 'MOVE') {
            handleMove(event.move);
          } else if (event.type === 'DISCONNECT') {
            cubeConnection = null;
            updateStatus('切断されました', 'disconnected');
            connectBtn.textContent = '接続';
            connectBtn.classList.remove('btn-disconnect');
          }
        });
      } catch (err) {
        cubeConnection = null;
        updateStatus(`エラー: ${err.message || err}`, 'error');
        connectBtn.textContent = '接続';
        connectBtn.classList.remove('btn-disconnect');
        connectBtn.disabled = false;
      }
    });

    init();
  </script>
</body>
</html>
